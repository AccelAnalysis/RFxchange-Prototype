name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Build 2D map
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Smoke test OpenStreetMap tile service
        run: npm run smoke:map

      - name: Browser-render the built map
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/RFxchange-Prototype/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke:browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-smoke-screenshots
          path: map-smoke-*.png
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-preview-logs
          path: |
            build.log
            preview.log
          if-no-files-found: warn
