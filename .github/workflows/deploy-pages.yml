name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build map recovery baseline
        run: npm run build

      - name: Smoke test basemap providers
        run: npm run smoke:map

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out repository for live-site validation
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validation dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Verify deployed HTML fingerprint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            HTML=$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${PAGE_URL}?rfx_build_check=${GITHUB_SHA}-${attempt}" || true)
            if grep -q 'leaflet-mobile-recovery-2026-07-25-1' <<< "$HTML"; then
              echo 'Expected deployed recovery build fingerprint found.'
              exit 0
            fi
            sleep 3
          done
          echo 'GitHub Pages is not serving the expected mobile recovery build fingerprint.' >&2
          exit 1

      - name: Browser-validate the public Pages site
        env:
          MAP_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_PREFIX: live-pages
        run: npm run smoke:browser

      - name: Upload live-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-screenshots
          path: live-pages-*.png
          if-no-files-found: warn
