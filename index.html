<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e5e7eb" />
    <meta name="description" content="The RFxchange map recovery baseline." />
    <meta name="rfx-build" content="leaflet-mobile-recovery-2026-07-25-1" />
    <title>The RFxchange Map</title>
    <script>
      // This prototype previously changed map runtimes several times. Remove any stale
      // browser-managed app cache/service worker state before the current bundle boots.
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister());
          });
        }
        if ('caches' in window) {
          caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
        }
      } catch (error) {
        console.warn('Stale-cache cleanup was unavailable:', error);
      }
    </script>
  </head>
  <body>
    <div id="map" aria-label="Interactive RFxchange map"></div>
    <div id="map-status" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
